name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ./*.zip

      - name: Fix API for 1.21.11
        run: |
          find VoidDls/src -name '*.java' -exec sed -i -E \
            -e 's/mc\.gui\.screen\(\)/mc.screen/g' \
            -e 's/(mc\.player|\bp)\.sendSystemMessage\(/net.minecraft.client.Minecraft.getInstance().gui.getChat().addMessage(/g' \
            -e 's/mc\.gameMode\.interact\(p, a, new net/mc.gameMode.interactAt(p, a, new net/g' \
            {} +

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: VoidDls
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voiddls-jar
          path: |
            VoidDls/build/libs/*.jar
            !VoidDls/build/libs/*-sources.jar
