name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ./*.zip

      - name: Fix screen API
        run: grep -rl "gui.screen()" VoidDls/src | xargs sed -i 's/mc\.gui\.screen()/mc.screen/g'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: VoidDls
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voiddls-jar
          path: |
            VoidDls/build/libs/*.jar
            !VoidDls/build/libs/*-sources.jar
            
